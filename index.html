<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>外贸英语单词 & 句子背诵</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #333;
}
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; color: #fff; margin-bottom: 20px; font-size: 24px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }

/* ============ Tab 导航 ============ */
.tabs {
    display: flex;
    background: #fff;
    border-radius: 12px;
    padding: 6px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.tab-btn {
    flex: 1;
    padding: 14px 20px;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    color: #888;
    transition: all 0.3s;
}
.tab-btn:hover { color: #667eea; }
.tab-btn.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    box-shadow: 0 4px 12px rgba(102,126,234,0.4);
}

/* ============ 通用控件 ============ */
.controls {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.control-row {
    display: flex; flex-wrap: wrap; gap: 15px;
    align-items: center; margin-bottom: 12px;
}
.control-row:last-child { margin-bottom: 0; }
.control-row label { font-weight: 600; color: #555; margin-right: 5px; font-size: 14px; }
select, button {
    padding: 8px 14px; border-radius: 8px;
    border: 2px solid #e0e0e0; font-size: 14px;
    cursor: pointer; transition: all 0.2s; background: #f9f9f9;
}
select:hover { border-color: #667eea; }

.btn {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff; border: none; padding: 10px 20px;
    font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-stop { background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%); }
.btn-familiar { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
.btn-skip { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
.btn-small { padding: 6px 12px; font-size: 12px; }

/* 发音切换按钮组 */
.accent-group {
    display: inline-flex; background: #f0f0f0; border-radius: 8px; padding: 3px;
}
.accent-btn {
    padding: 6px 14px; border: none; background: transparent; cursor: pointer;
    border-radius: 6px; font-size: 13px; font-weight: 600; color: #666; transition: all 0.2s;
}
.accent-btn.active {
    background: #fff; color: #667eea; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.speed-control { display: flex; align-items: center; gap: 8px; }
.speed-control input[type="range"] { width: 100px; }

/* ============ 主内容 ============ */
.main-content { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
@media (max-width: 768px) { .main-content { grid-template-columns: 1fr; } }

/* 卡片 */
.card {
    background: #fff; border-radius: 16px; padding: 40px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12); text-align: center;
    margin-bottom: 20px; position: relative; min-height: 280px;
    display: flex; flex-direction: column; justify-content: center;
    transition: transform 0.3s;
}
.card:hover { transform: translateY(-4px); }
.card.speaking { animation: pulse 1s infinite; }
@keyframes pulse {
    0%,100% { box-shadow: 0 8px 32px rgba(102,126,234,0.2); }
    50% { box-shadow: 0 8px 48px rgba(102,126,234,0.5); }
}
.card-id {
    position: absolute; top: 15px; left: 20px;
    color: #999; font-size: 12px; font-weight: 600;
    background: #f0f0f0; padding: 4px 10px; border-radius: 12px;
}
.card-cat {
    position: absolute; top: 15px; right: 20px;
    color: #764ba2; font-size: 12px; font-weight: 600;
    background: #ede9fe; padding: 4px 10px; border-radius: 12px;
}

/* 单词卡片样式 */
.word-text {
    font-size: 48px; font-weight: 700; color: #2d3748;
    margin: 20px 0 10px; cursor: pointer; user-select: none;
}
.word-text:hover { color: #667eea; }
.phonetic { font-size: 20px; color: #718096; margin-bottom: 20px; }
.meaning { font-size: 24px; color: #4a5568; font-weight: 500; }

/* 句子卡片样式 */
.sent-en {
    font-size: 28px; font-weight: 600; color: #2d3748;
    margin: 20px 0 15px; cursor: pointer; line-height: 1.5;
}
.sent-en:hover { color: #667eea; }
.sent-zh { font-size: 20px; color: #4a5568; font-weight: 400; line-height: 1.6; }

/* 动作按钮 */
.action-row {
    display: flex; gap: 15px; justify-content: center;
    flex-wrap: wrap; margin-bottom: 20px;
}
.action-row .btn { font-size: 16px; padding: 14px 28px; }

/* 进度 */
.progress-area {
    background: #fff; border-radius: 12px; padding: 15px 20px;
    margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.progress-info {
    display: flex; justify-content: space-between;
    margin-bottom: 8px; font-size: 14px; color: #555;
}
.progress-bar { height: 10px; background: #e5e7eb; border-radius: 5px; overflow: hidden; }
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea, #764ba2);
    border-radius: 5px; transition: width 0.3s;
}

/* 熟悉面板 */
.familiar-panel {
    background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    overflow: hidden; max-height: calc(100vh - 200px);
    display: flex; flex-direction: column;
}
.familiar-header {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: #fff; padding: 15px 20px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
}
.familiar-list { overflow-y: auto; flex: 1; padding: 10px; }
.familiar-item {
    padding: 10px 12px; border-radius: 8px; margin-bottom: 6px;
    background: #f0fdf4; cursor: pointer; transition: all 0.2s;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.familiar-item:hover { background: #dcfce7; transform: translateX(4px); }
.familiar-item .w { font-weight: 600; color: #166534; font-size: 14px; }
.familiar-item .m { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
.familiar-item .en { font-weight: 600; color: #166534; font-size: 13px; flex: 1; }
.familiar-item .zh { font-size: 12px; color: #666; max-width: 100px; }
.familiar-item .remove-btn {
    color: #999; font-size: 14px; border: none; background: none;
    cursor: pointer; padding: 2px 6px; border-radius: 4px;
}
.familiar-item .remove-btn:hover { background: #fee2e2; color: #dc2626; }

.empty-state { text-align: center; padding: 40px; color: #999; }
.empty-state .icon { font-size: 48px; margin-bottom: 10px; }

/* Toast */
.toast {
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85); color: #fff;
    padding: 12px 24px; border-radius: 8px;
    z-index: 1000; animation: slideDown 0.3s ease;
}
@keyframes slideDown {
    from { transform: translate(-50%, -100px); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
}

/* 隐藏/显示 */
.section { display: none; }
.section.active { display: block; }

/* 英/美标记角标 */
.accent-badge {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    font-weight: 600; color: #fff;
}
.accent-badge.US { background: #3b82f6; }
.accent-badge.UK { background: #ef4444; }
</style>
</head>
<body>

    <!-- Tab 切换 -->
    <div class="tabs">

                    <div class="empty-state"><div class="icon">📭</div><p>点击"熟悉"按钮<br>将句子加入这里</p></div>

<script src="words.js"></script>
<script src="sentences.js"></script>
<script>
// ============================================================
//  通用工具函数
// ============================================================
const ACCENT_LABEL = { US: '🇺🇸 US', UK: '🇬🇧 UK' };
const ACCENT_LANG = { US: 'en-US', UK: 'en-GB' };

// 获取指定口音的 voice
function pickVoice(voices, accent) {
    const lang = ACCENT_LANG[accent];
    const preferred = (accent === 'US' ? ['Female', 'Google US'] : ['Female', 'Google UK', 'English UK']);
    // 1) 优先匹配名字含关键词 + lang 匹配
    for (const kw of preferred) {
        const v = voices.find(x => x.lang.startsWith(lang) && x.name.includes(kw));
        if (v) return v;
    }
    // 2) 任意 lang 匹配
    const v = voices.find(x => x.lang.startsWith(lang));
    if (v) return v;
    // 3) 任意英语
    return voices.find(x => x.lang.startsWith('en')) || null;
}

function speak(text, accent, rate) {
    if (!text) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = ACCENT_LANG[accent];
    utter.rate = rate;
    utter.pitch = 1;
    const voices = window.speechSynthesis.getVoices();
    const voice = pickVoice(voices, accent);
    if (voice) utter.voice = voice;
    window.speechSynthesis.speak(utter);
}

// 预热 voices
if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
}

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// ============================================================
//  Tab 切换
// ============================================================
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('section-' + btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'words') WORD.stopPlay();
        else SENT.stopPlay();
    });
});

// 发音组切换（每个 section 独立）
document.querySelectorAll('.accent-group').forEach(group => {
    group.querySelectorAll('.accent-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            group.querySelectorAll('.accent-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const sectionId = group.closest('.section').id;
            const accent = btn.dataset.accent;
            if (sectionId === 'section-words') {
                WORD.state.accent = accent;
                document.getElementById('w-accentBadge').textContent = ACCENT_LABEL[accent];
                document.getElementById('w-accentBadge').className = 'accent-badge ' + accent;
            } else {
                SENT.state.accent = accent;
                document.getElementById('s-accentBadge').textContent = ACCENT_LABEL[accent];
                document.getElementById('s-accentBadge').className = 'accent-badge ' + accent;
            }
        });
    });
});

// ============================================================
//  单词模块
// ============================================================
const WORD = {
    data: [],
    categories: [],
    state: {
        queue: [], index: 0, familiar: new Set(),
        accent: 'US', isPlaying: false, timer: null
    },
    init() {
        this.data = WORDS_DATA;
        // 加载熟悉词
        try { this.state.familiar = new Set(JSON.parse(localStorage.getItem('w_fam') || '[]')); } catch(e){}
        // 分类
        const catsMap = {};
        this.data.forEach(w => { catsMap[w.category] = w.categoryName; });
        this.categories = Object.keys(catsMap).sort().map(cid => ({ id: +cid, name: catsMap[cid] }));
        const sel = document.getElementById('w-categorySelect');
        this.categories.forEach(c => {
            const count = this.data.filter(w => w.category === c.id).length;
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = `${String(c.id).padStart(2,'0')} ${c.name} (${count}词)`;
            sel.appendChild(opt);
        });
        // 事件
        const S = this.state;
        document.getElementById('w-categorySelect').onchange = () => { this.rebuild(); this.render(); };
        document.getElementById('w-modeSelect').onchange = () => { this.rebuild(); this.render(); };
        document.getElementById('w-speechRate').oninput = (e) => {
            document.getElementById('w-rateLabel').textContent = e.target.value + 'x';
        };
        document.getElementById('w-text').onclick = () => this.speakCurr();
        document.getElementById('w-startBtn').onclick = () => this.startPlay();
        document.getElementById('w-stopBtn').onclick = () => this.stopPlay();
        document.getElementById('w-prevBtn').onclick = () => { S.index = Math.max(0, S.index - 1); this.render(); this.speakCurr(); };
        document.getElementById('w-nextBtn').onclick = () => { S.index++; this.render(); this.speakCurr(); };
        document.getElementById('w-familiarBtn').onclick = () => this.markFamiliar();
        document.getElementById('w-skipBtn').onclick = () => { S.index++; this.render(); };
        document.getElementById('w-replayBtn').onclick = () => this.speakCurr();
        document.getElementById('w-switchAccentBtn').onclick = () => {
            const other = this.state.accent === 'US' ? 'UK' : 'US';
            const group = document.querySelector('#section-words .accent-group');
            group.querySelector(`[data-accent="${other}"]`).click();
            setTimeout(() => this.speakCurr(), 50);
        };
        document.getElementById('w-resetBtn').onclick = () => {
            if (!confirm('确定重置所有熟悉的单词吗？')) return;
            this.state.familiar.clear();
            this.rebuild(); this.render(); this.renderFamiliar(); this.updateStats();
            toast('🔄 已重置');
        };

        this.rebuild();
        this.render();
        this.renderFamiliar();
        this.updateStats();
    },
    rebuild() {
        const S = this.state;
        const cat = document.getElementById('w-categorySelect').value;
        const mode = document.getElementById('w-modeSelect').value;
        let pool = this.data.filter(w => !S.familiar.has(w.id));
        if (cat !== 'all') pool = pool.filter(w => w.category === +cat);
        if (mode === 'random') pool = shuffle(pool);
        S.queue = pool;
        if (S.index >= S.queue.length) S.index = 0;
    },
    curr() { return this.state.queue[this.state.index]; },
    rate() { return parseFloat(document.getElementById('w-speechRate').value); },
    speakCurr() { speak(this.curr()?.word, this.state.accent, this.rate()); },
    render() {
        const w = this.curr();
        if (!w) {
            document.getElementById('w-id').textContent = '-';
            document.getElementById('w-cat').textContent = '-';
            document.getElementById('w-text').textContent = '🎉 恭喜！';
            document.getElementById('w-phonetic').textContent = '当前范围内的词全部熟悉了';
            document.getElementById('w-meaning').textContent = '切换分类或重置进度继续';
            document.getElementById('w-progressText').textContent = '队列已空';
            document.getElementById('w-progressFill').style.width = '100%';
            return;
        }
        document.getElementById('w-id').textContent = w.id;
        document.getElementById('w-cat').textContent = `${w.category}. ${w.categoryName}`;
        document.getElementById('w-text').textContent = w.word;
        document.getElementById('w-phonetic').textContent = w.phonetic;
        document.getElementById('w-meaning').textContent = w.meaning;
        const total = this.state.queue.length;
        document.getElementById('w-progressText').textContent = `第 ${this.state.index + 1} / ${total} 个（未熟悉队列）`;
        document.getElementById('w-progressFill').style.width = ((this.state.index + 1) / total * 100) + '%';
    },
    renderFamiliar() {
        const S = this.state;
        document.getElementById('w-famCount').textContent = S.familiar.size;
        const list = document.getElementById('w-famList');
        if (S.familiar.size === 0) {
            list.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>点击"熟悉"按钮<br>将单词加入这里</p></div>`;
            return;
        }
        const items = this.data.filter(w => S.familiar.has(w.id));
        list.innerHTML = items.map(w => `
            <div class="familiar-item">
                <span class="w" onclick="WORD.speakById('${w.id}')">🔊 ${w.word}</span>
                <span class="m">${w.meaning}</span>
                <button class="remove-btn" onclick="WORD.unfam('${w.id}')">✕</button>
            </div>
        `).join('');
    },
    speakById(id) {
        const w = this.data.find(x => x.id === id);
        if (w) speak(w.word, this.state.accent, this.rate());
    },
    unfam(id) {
        this.state.familiar.delete(id);
        localStorage.setItem('w_fam', JSON.stringify([...this.state.familiar]));
        this.renderFamiliar(); this.updateStats(); this.rebuild(); this.render();
        toast('已从熟悉列表移除');
    },
    updateStats() {
        document.getElementById('w-statsText').textContent =
            `已熟悉 ${this.state.familiar.size} / ${this.data.length}`;
    },
    markFamiliar() {
        const w = this.curr();
        if (!w) return;
        this.state.familiar.add(w.id);
        localStorage.setItem('w_fam', JSON.stringify([...this.state.familiar]));
        toast(`✅ "${w.word}" 已标记熟悉`);
        this.renderFamiliar(); this.updateStats();
        this.rebuild();
        if (this.state.index >= this.state.queue.length) this.state.index = 0;
        this.render();
        if (this.state.isPlaying) this.nextAuto();
    },
    startPlay() {
        const S = this.state;
        if (S.isPlaying) return;
        this.rebuild();
        if (S.queue.length === 0) { toast('没有可朗读的单词！'); return; }
        S.isPlaying = true;
        document.getElementById('w-startBtn').disabled = true;
        document.getElementById('w-stopBtn').disabled = false;
        document.getElementById('w-wordCard').classList.add('speaking');
        this.playAuto();
    },
    stopPlay() {
        const S = this.state;
        S.isPlaying = false;
        clearTimeout(S.timer);
        window.speechSynthesis.cancel();
        document.getElementById('w-startBtn').disabled = false;
        document.getElementById('w-stopBtn').disabled = true;
        document.getElementById('w-wordCard').classList.remove('speaking');
    },
    playAuto() {
        const S = this.state;
        if (!S.isPlaying) return;
        if (S.index >= S.queue.length) { this.stopPlay(); toast('🎉 朗读完成！'); return; }
        this.render();
        this.speakCurr();
        const interval = parseInt(document.getElementById('w-intervalSelect').value);
        S.timer = setTimeout(() => { S.index++; this.playAuto(); }, interval);
    },
    nextAuto() {
        clearTimeout(this.state.timer);
        this.state.index++;
        this.playAuto();
    }
};

// ============================================================
//  句子模块
// ============================================================
const SENT = {
    data: [],
    categories: [],
    state: {
        queue: [], index: 0, familiar: new Set(),
        accent: 'US', isPlaying: false, timer: null
    },
    init() {
        this.data = SENTENCES_DATA;
        try { this.state.familiar = new Set(JSON.parse(localStorage.getItem('s_fam') || '[]')); } catch(e){}
        // 强制根据编号范围分配分类（001-010=01, 011-020=02...191-200=20）
        const names = {
            '01':'初次联系与自我介绍','02':'客户开发与需求了解','03':'收到询价与资料补充',
            '04':'阀门规格与技术确认','05':'报价发送与说明','06':'价格谈判与优惠',
            '07':'样品与定制开发','08':'订单与合同确认','09':'付款与银行信息',
            '10':'生产进度与交货期','11':'质量检验与文件','12':'包装与唛头',
            '13':'海运与货代沟通','14':'空运快递与收货','15':'报关与单证核对',
            '16':'交期延误与变更','17':'投诉处理与售后','18':'跟进与催复',
            '19':'会议与来访接待','20':'合作维护与复购'
        };
        this.data.forEach(s => {
            const idx = parseInt(s.id);
            const catNum = String(Math.ceil(idx / 10)).padStart(2, '0');
            s.category = catNum;
            s.categoryName = names[catNum] || '';
        });
        // 分类选择器
        const catsMap = {};
        this.data.forEach(s => { if (s.category) catsMap[s.category] = s.categoryName; });
        this.categories = Object.keys(catsMap).sort().map(cid => ({ id: cid, name: catsMap[cid] }));
        const sel = document.getElementById('s-categorySelect');
        this.categories.forEach(c => {
            const count = this.data.filter(s => s.category === c.id).length;
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = `${c.id} ${c.name} (${count}句)`;
            sel.appendChild(opt);
        });
        // 事件
        const S = this.state;
        document.getElementById('s-categorySelect').onchange = () => { this.rebuild(); this.render(); };
        document.getElementById('s-modeSelect').onchange = () => { this.rebuild(); this.render(); };
        document.getElementById('s-speechRate').oninput = (e) => {
            document.getElementById('s-rateLabel').textContent = e.target.value + 'x';
        };
        document.getElementById('s-en').onclick = () => this.speakCurr();
        document.getElementById('s-startBtn').onclick = () => this.startPlay();
        document.getElementById('s-stopBtn').onclick = () => this.stopPlay();
        document.getElementById('s-prevBtn').onclick = () => { S.index = Math.max(0, S.index - 1); this.render(); this.speakCurr(); };
        document.getElementById('s-nextBtn').onclick = () => { S.index++; this.render(); this.speakCurr(); };
        document.getElementById('s-familiarBtn').onclick = () => this.markFamiliar();
        document.getElementById('s-skipBtn').onclick = () => { S.index++; this.render(); };
        document.getElementById('s-replayBtn').onclick = () => this.speakCurr();
        document.getElementById('s-switchAccentBtn').onclick = () => {
            const other = this.state.accent === 'US' ? 'UK' : 'US';
            const group = document.querySelector('#section-sentences .accent-group');
            group.querySelector(`[data-accent="${other}"]`).click();
            setTimeout(() => this.speakCurr(), 50);
        };
        document.getElementById('s-resetBtn').onclick = () => {
            if (!confirm('确定重置所有熟悉的句子吗？')) return;
            this.state.familiar.clear();
            this.rebuild(); this.render(); this.renderFamiliar(); this.updateStats();
            toast('🔄 已重置');
        };

        this.rebuild();
        this.render();
        this.renderFamiliar();
        this.updateStats();
    },
    rebuild() {
        const S = this.state;
        const cat = document.getElementById('s-categorySelect').value;
        const mode = document.getElementById('s-modeSelect').value;
        let pool = this.data.filter(s => !S.familiar.has(s.id));
        if (cat !== 'all') pool = pool.filter(s => s.category === cat);
        if (mode === 'random') pool = shuffle(pool);
        S.queue = pool;
        if (S.index >= S.queue.length) S.index = 0;
    },
    curr() { return this.state.queue[this.state.index]; },
    rate() { return parseFloat(document.getElementById('s-speechRate').value); },
    speakCurr() { speak(this.curr()?.en, this.state.accent, this.rate()); },
    render() {
        const s = this.curr();
        if (!s) {
            document.getElementById('s-id').textContent = '-';
            document.getElementById('s-cat').textContent = '-';
            document.getElementById('s-en').textContent = '🎉 恭喜！';
            document.getElementById('s-zh').textContent = '当前范围内的句子全部熟悉了';
            document.getElementById('s-progressText').textContent = '队列已空';
            document.getElementById('s-progressFill').style.width = '100%';
            return;
        }
        document.getElementById('s-id').textContent = s.id;
        document.getElementById('s-cat').textContent = `${s.category}. ${s.categoryName}`;
        document.getElementById('s-en').textContent = s.en;
        document.getElementById('s-zh').textContent = s.zh;
        const total = this.state.queue.length;
        document.getElementById('s-progressText').textContent = `第 ${this.state.index + 1} / ${total} 句（未熟悉队列）`;
        document.getElementById('s-progressFill').style.width = ((this.state.index + 1) / total * 100) + '%';
    },
    renderFamiliar() {
        const S = this.state;
        document.getElementById('s-famCount').textContent = S.familiar.size;
        const list = document.getElementById('s-famList');
        if (S.familiar.size === 0) {
            list.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>点击"熟悉"按钮<br>将句子加入这里</p></div>`;
            return;
        }
        const items = this.data.filter(s => S.familiar.has(s.id));
        list.innerHTML = items.map(s => `
            <div class="familiar-item">
                <span class="en" onclick="SENT.speakById('${s.id}')">🔊 ${s.en.substring(0,35)}${s.en.length>35?'...':''}</span>
                <span class="zh">${s.zh.substring(0,12)}</span>
                <button class="remove-btn" onclick="SENT.unfam('${s.id}')">✕</button>
            </div>
        `).join('');
    },
    speakById(id) {
        const s = this.data.find(x => x.id === id);
        if (s) speak(s.en, this.state.accent, this.rate());
    },
    unfam(id) {
        this.state.familiar.delete(id);
        localStorage.setItem('s_fam', JSON.stringify([...this.state.familiar]));
        this.renderFamiliar(); this.updateStats(); this.rebuild(); this.render();
        toast('已从熟悉列表移除');
    },
    updateStats() {
        document.getElementById('s-statsText').textContent =
            `已熟悉 ${this.state.familiar.size} / ${this.data.length}`;
    },
    markFamiliar() {
        const s = this.curr();
        if (!s) return;
        this.state.familiar.add(s.id);
        localStorage.setItem('s_fam', JSON.stringify([...this.state.familiar]));
        toast(`✅ "${s.en.substring(0,20)}..." 已标记熟悉`);
        this.renderFamiliar(); this.updateStats();
        this.rebuild();
        if (this.state.index >= this.state.queue.length) this.state.index = 0;
        this.render();
        if (this.state.isPlaying) this.nextAuto();
    },
    startPlay() {
        const S = this.state;
        if (S.isPlaying) return;
        this.rebuild();
        if (S.queue.length === 0) { toast('没有可朗读的句子！'); return; }
        S.isPlaying = true;
        document.getElementById('s-startBtn').disabled = true;
        document.getElementById('s-stopBtn').disabled = false;
        document.getElementById('s-sentCard').classList.add('speaking');
        this.playAuto();
    },
    stopPlay() {
        const S = this.state;
        S.isPlaying = false;
        clearTimeout(S.timer);
        window.speechSynthesis.cancel();
        document.getElementById('s-startBtn').disabled = false;
        document.getElementById('s-stopBtn').disabled = true;
        document.getElementById('s-sentCard').classList.remove('speaking');
    },
    playAuto() {
        const S = this.state;
        if (!S.isPlaying) return;
        if (S.index >= S.queue.length) { this.stopPlay(); toast('🎉 朗读完成！'); return; }
        this.render();
        this.speakCurr();
        const interval = parseInt(document.getElementById('s-intervalSelect').value);
        S.timer = setTimeout(() => { S.index++; this.playAuto(); }, interval);
    },
    nextAuto() {
        clearTimeout(this.state.timer);
        this.state.index++;
        this.playAuto();
    }
};

// 暴露给全局（给熟悉列表 onclick 用）
window.WORD = WORD;
window.SENT = SENT;

// 启动
WORD.init();
SENT.init();
</script>
